name: gate
on:
  push:
    branches: [main]
    tags: ['*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Never set MATHLIB_CACHE_USE_CLOUDFLARE in this file: as of 20 Sep 2026 the mirror does not
# hold this Mathlib pin, while the default cache endpoint does.

jobs:
  build-and-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # tags and full history for the tag check

      - name: Pin self-check
        run: |
          test "$(cat lean-toolchain)" = "leanprover/lean4:v4.31.0-rc2"
          grep -q '"rev": "15a89b2468bc01f1a6230d6e49ef5efc5286e502"' lake-manifest.json

      - name: Free runner disk (about 14 GB is tight for Mathlib oleans plus toolchain)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          df -h /

      - name: Build (elan from lean-toolchain, Mathlib oleans from the cache, lake build)
        uses: leanprover/lean-action@v1
        with:
          auto-config: false
          use-mathlib-cache: true
          use-github-cache: false
          build: true
          test: false
          lint: false
          # axiom-audit-root defaults to the library name TheoremB. The audit selects by module:
          # every constant defined in a module of the library (2038 in CI on 13 Nov 2026). A
          # local check found all 484 ledger names among them. The next steps check the ledger
          # itself, by count and by name.
          axiom-audit: true
          # Off: this check passes only for a public repository with at least 2 stars, an
          # OSI-approved licence and a lake-manifest.json. On 13 Nov 2026 this repository was
          # private with no stars, so the check failed and, as a failed step, skipped the
          # steps after it.
          check-reservoir-eligibility: false

      # The next three steps also run after an earlier step has failed, so a failure above does
      # not hide the project's own gate. They are skipped only if the run is cancelled, and the
      # job still ends red after a failed step.
      - name: Drop the .ltar download cache after unpacking (disk)
        if: ${{ !cancelled() }}
        run: rm -rf ~/.cache/mathlib && df -h /

      - name: Axiom gate
        if: ${{ !cancelled() }}
        run: |
          bash scripts/check_axioms.sh | tee gate.log
          test "${PIPESTATUS[0]}" = "0"
          grep -q '^GATE: GREEN' gate.log

      - name: Entry count on the bracket pattern (join wrapped lines; never a quote-delimited regex)
        if: ${{ !cancelled() }}
        run: |
          EXPECTED=$(grep -c '^#print axioms' AxiomCheck.lean)
          FOUND=$(awk '/\[/ && !/\]/ {buf=$0; next} buf!="" {buf=buf" "$0; if (index($0,"]")) {print buf; buf=""}; next} {print}' gate.log | grep -c 'depends on axioms: \[')
          echo "entries: $FOUND expected: $EXPECTED"
          test "$FOUND" = "$EXPECTED"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gate-log
          path: gate.log

  replay:
    # kernel replay of every module through the toolchain's leanchecker; on demand and on tags.
    # The job took about 20 minutes in CI on 13 Nov 2026 (build included).
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
    needs: build-and-gate
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - name: Free runner disk
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc || true
      - uses: leanprover/lean-action@v1
        with:
          auto-config: false
          use-mathlib-cache: true
          use-github-cache: false
          build: true
          test: false
          lint: false
      - run: rm -rf ~/.cache/mathlib
      - name: Per-module leanchecker replay (umbrella module skipped by design; needs more than 23 GB)
        run: bash scripts/replay_leanchecker.sh .lake/leanchecker
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: leanchecker-replay
          path: .lake/leanchecker

  tags:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Frozen capstones byte-identical at their tags
        run: bash scripts/check_tags.sh
